# This is a Declarative Automation Bundle definition for healthcare_claims.

bundle:
  name: healthcare_claims
  uuid: 72cefa2a-305e-4a5a-a775-de7fdf7a301d

include:
  - resources/*.yml

resources:
  schemas:
    claims_dev:
      catalog_name: main
      name: healthcare_claims_dev
      comment: "Development schema for claims data."

  volumes:
    claims_landing:
      catalog_name: main
      schema_name: healthcare_claims_dev
      name: healthcare_claims_landing
      comment: "Landing zone for incoming claims files."

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: healthcare_claims_dev
      schema: dev
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: healthcare_claims_prod
      schema: prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
