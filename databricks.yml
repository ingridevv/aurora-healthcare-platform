# This is a Declarative Automation Bundle definition for the project Healthcare Data Platform.
bundle:
  name: healthcare_data_platform
  uuid: 72cefa2a-305e-4a5a-a775-de7fdf7a301d

include:
  - resources/*.yml

variables:
  catalog:
    description: Target catalog for cross-environment deployments.
    default: healthcare_dev
  schema:
    description: Default fallback schema for unassigned resources.
    default: dev

targets:
  dev:
    default: true
    variables:
      catalog: healthcare_dev
      schema: dev